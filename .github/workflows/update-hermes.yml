name: Update split Hermes and OmniRoute

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-upstream-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check latest official Hermes Docker digest
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --retry 3 -fsSL 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:nousresearch/hermes-agent:pull' | jq -r .token)"
          digest="$(curl --retry 3 -fsSI \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            'https://registry-1.docker.io/v2/nousresearch/hermes-agent/manifests/latest' \
            | tr -d '\r' \
            | awk 'tolower($1)=="docker-content-digest:" {print $2}' \
            | tail -1)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "$digest" > .hermes-image-digest
          python3 - <<'PY'
          from pathlib import Path
          import re
          digest=Path(".hermes-image-digest").read_text().strip()
          path=Path("Dockerfile")
          text=path.read_text()
          text,count=re.subn(r"^FROM nousresearch/hermes-agent(?::latest|@sha256:[a-f0-9]{64})",
                             "FROM nousresearch/hermes-agent@"+digest,text,count=1,flags=re.M)
          if count!=1: raise SystemExit("Hermes base image declaration has changed; review required")
          path.write_text(text)
          PY

      - name: Check official OmniRoute npm release
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view omniroute dist-tags.latest --json | tr -d '"\r\n')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "$version" > .omniroute-version
          python3 - <<'PY'
          from pathlib import Path
          import re
          version=Path(".omniroute-version").read_text().strip()
          path=Path("Dockerfile")
          text=path.read_text()
          text,count=re.subn(r"npm install -g omniroute@[0-9]+\.[0-9]+\.[0-9]+",
                             "npm install -g omniroute@"+version,text,count=1)
          if count!=1: raise SystemExit("OmniRoute install pin has changed; review required")
          path.write_text(text)
          PY

      - name: Sync selected OmniRoute provider metadata to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, urllib.request
          version=Path(".omniroute-version").read_text().strip()
          root="https://raw.githubusercontent.com/diegosouzapw/OmniRoute/v"+version+"/open-sse/config/providers/registry/"
          def read(provider):
              req=urllib.request.Request(root+provider+"/index.ts",headers={"User-Agent":"Hermes-upstream-updater"})
              with urllib.request.urlopen(req,timeout=25) as result:
                  return result.read().decode("utf-8")
          openrouter=read("openrouter")
          gemini=read("gemini")
          match=re.search(r'\bbaseUrl:\s*"([^"]+)"',openrouter)
          if not match or match.group(1)!="https://openrouter.ai/api/v1/chat/completions":
              raise SystemExit("OpenRouter endpoint changed; human compatibility review required")
          models=list(dict.fromkeys(re.findall(r'\bid:\s*"(gemini-[a-zA-Z0-9.-]+)"',gemini)))
          if len(models)<2:
              raise SystemExit("Gemini registry changed; human compatibility review required")
          catalog={"version":version,"openrouterEndpoint":match.group(1),"geminiModels":models}
          output=("// Selected metadata from the official OmniRoute v"+version+" provider registry.\n"
                  "// Generated by GitHub Actions; no OmniRoute server is needed on Cloudflare.\n"
                  "export const OMNIROUTE_CATALOG = Object.freeze("
                  +json.dumps(catalog,indent=2,ensure_ascii=True)+");\n")
          Path("cloudflare/omniroute-catalog.js").write_text(output)
          PY

      - name: Check Cloudflare adapter syntax before committing
        run: |
          node --input-type=module --check < cloudflare/worker.js
          node --input-type=module --check < cloudflare/manager.js
          node --input-type=module --check < cloudflare/omniroute-catalog.js

      - name: Commit upstream versions only when changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add Dockerfile .hermes-image-digest .omniroute-version cloudflare/omniroute-catalog.js
          if git diff --cached --quiet; then
            echo "Both upstream versions unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: update pinned Hermes and OmniRoute releases"
          git push

      # Optional fallback if Render's connected GitHub auto-deploy webhook is unavailable.
      - name: Render deployment hook fallback
        if: steps.commit.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsSL --retry 3 -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "Render auto-deploy on main remains the primary update mechanism."
          fi
      # GITHUB_TOKEN pushes do not trigger on:push workflows, so deploy from this run.
      - name: Deploy Cloudflare after an upstream update
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 28fc9425581f4f987721877deab55985
          wranglerVersion: 4.136.3
          command: deploy -c wrangler.toml
