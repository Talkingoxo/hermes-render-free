name: Verify and deploy Cloudflare Hermes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check both Cloudflare modules
        run: |
          node --input-type=module --check < cloudflare/worker.js
          node --input-type=module --check < cloudflare/free-models.js
          node --test cloudflare/free-models.test.mjs
      - name: Dry-run the exact single-Worker bundle
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.toml --dry-run --outdir /tmp/hermes-bundle
      - name: Deploy same Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 28fc9425581f4f987721877deab55985
          wranglerVersion: 4.136.3
          command: deploy -c wrangler.toml
